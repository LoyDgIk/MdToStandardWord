[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2std"
version = "0.1.2"
description = "Convert Chinese standard Markdown documents to standard Word DOCX files."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "LoyDgIk" }
]
dependencies = [
  "python-docx>=1.1.0",
  "markdown-it-py>=3.0.0",
  "PyYAML>=6.0",
  "latex2mathml>=3.77.0",
  "lxml>=4.9.0",
]

[project.optional-dependencies]
render = [
  "pywin32>=306; platform_system == 'Windows'",
  "pypdfium2>=4.30.0",
]

[project.scripts]
md2std = "md2std.cli:main"

[tool.setuptools.packages.find]
include = ["md2std*"]

[tool.setuptools.package-data]
md2std = ["templates/*.docx"]
